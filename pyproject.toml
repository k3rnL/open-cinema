[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-cinema"
dynamic = ["version"]
description = "Audio processing control system with CamillaDSP integration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Erwan Daniel"},
]
keywords = ["audio", "dsp", "camilladsp", "pipewire", "wireplumber"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Django>=6.0",
    "PyYAML>=6.0",
    "websocket-client>=1.9.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.11.2",
    "camilladsp==4.0.0",
    "django-enum>=2.3.0",
    "djangorestframework>=3.16.1",
    "celery[redis]>=5.6.2",
    "gunicorn==23.0.0",
    "jsonschema>=4.25",
    "packaging>=24.0",
    "wyreplumber==0.2.0",
]

[project.scripts]
open-cinema-orchestrator = "opencinema.orchestrator:main"

[project.entry-points."open_cinema.plugins"]
counter = "plugin.counter.api.plugin:CounterPlugin"

[tool.uv.sources]
camilladsp = { git = "https://github.com/HEnquist/pycamilladsp.git", rev = "fdc0d163e02dd73206a493402b43c83502ad83d7" }
wyreplumber = { path = "../wyreplumber", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "factory-boy>=3.3",
    "hypothesis>=6.138",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/k3rnL/open-cinema"
Documentation = "https://github.com/k3rnL/open-cinema#readme"
Repository = "https://github.com/k3rnL/open-cinema"
Issues = "https://github.com/k3rnL/open-cinema/issues"

[tool.setuptools]
py-modules = ["opencinema_plugin_bootstrap"]

[tool.setuptools.dynamic]
version = {attr = "opencinema.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["opencinema*", "api*", "core*", "plugin*", "contracts*", "open_cinema_plugin_sdk*"]
exclude = ["tests*", ".venv*", "deployment*"]

[tool.setuptools.package-data]
contracts = ["*.json", "*.yml"]
open_cinema_plugin_sdk = ["py.typed"]
"plugin.counter" = ["open-cinema-plugin.toml"]
"core.plugin_system" = ["first_party_plugins.json"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.venv2
  | build
  | dist
  | migrations
)/
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "opencinema.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
