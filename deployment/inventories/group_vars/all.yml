project_root: "/opt/home-cinema"

# Rollback-window closure remains an explicit operator decision. Release status
# is owned only by the coordinated manifest.
open_cinema_close_rollback_window: false
# Explicit recovery maintenance may reseed a checksum-verified bundle from the
# currently installed generation even when the candidate digest is unchanged.
# Normal reconciliation must leave this disabled.
open_cinema_reseed_rollback_boundary: false

release_manifest:
  source_path: >-
    {{ open_cinema_release_manifest_source_path |
       default(playbook_dir ~ '/../releases/open-cinema-0.3.2.yml') }}
  install_dir: "/etc/open-cinema"
  install_path: "/etc/open-cinema/release-manifest.yml"
  installed_identity_path: "/var/lib/open-cinema/deployment-diagnostics/installed-release.yml"
  artifact_cache_root: "/var/cache/open-cinema/artifacts"

# Appliance inventories must provide a controller-local, access-controlled
# path for a manifest that uses the private first-release rollback exception.
# Mutable development deployments skip this verification deliberately.
private_rollback_capsule_path: ""

# One headless service identity owns the PipeWire graph and every process that
# participates in it. Stable UID/GID values are explicit inventory data and may
# be overridden only after preflight proves they do not identify another user.
open_cinema_service_uid: 999
open_cinema_service_gid: 985

audio_service:
  user: "opencinema"
  group: "opencinema"
  exclusive: true
  # Appliance login accounts must not start a second session manager that can
  # race the dedicated audio owner for ALSA or Bluetooth devices.
  competing_session_users:
    - "{{ ansible_user }}"
  supplementary_groups:
    - audio
    - video
  runtime_dir: "/run/user/{{ open_cinema_service_uid }}"
  pipewire_socket: "/run/user/{{ open_cinema_service_uid }}/pipewire-0"
  dbus_address: "unix:path=/run/user/{{ open_cinema_service_uid }}/bus"

pipewire:
  package: "pipewire"
  minimum_version: "1.4.0"

wireplumber:
  package: "wireplumber"
  minimum_version: "0.5.8"
  api_family: "0.5"

redis_policy:
  maxmemory_mb: 128
  systemd_memory_max_mb: 192
  maxmemory_policy: noeviction
  maxclients: 256

wyreplumber:
  app_path: "{{ project_root }}/wyreplumber"
  local_source_path: "../wyreplumber"
  required_contract: 1

# API calls are rejected by nginx unless their source is in this explicit
# boundary. Appliance inventories must add their management LAN.
open_cinema_management_api_networks:
  - 127.0.0.1

# Open Cinema Application
open_cinema:
  python_version: "3.13"
  app_path: "{{ project_root }}/open-cinema"
  venv_path: "{{ project_root }}/open-cinema/venv"
  user: "opencinema"
  group: "opencinema"
  # Celery runs the bounded orchestration-retention task; it is not used for
  # audio discovery, apply, or backend lifecycle work.
  celery_enabled: true
  orchestrator_enabled: true
  rollback_root: "/var/lib/open-cinema/rollback"
  # Exactly one pre-deployment coordinated release remains recoverable after a
  # successful readiness pass. Failed deployments never run the pruning step.
  rollback_releases_to_keep: 1
  transition_timeout_seconds: 300
  transition_timeout_kill_grace_seconds: 15
  diagnostics_root: "/var/lib/open-cinema/deployment-diagnostics"
  readiness_result_path: "/var/lib/open-cinema/deployment-diagnostics/readiness-result.json"
  runtime_redis_key: "open-cinema:orchestration:runtime-world:v1"
  orchestrator_lock_path: "/run/open-cinema/orchestrator.lock"
  audio_adapter_media_root: "{{ project_root }}/open-cinema/media/audio-adapters"
  plugins:
    root: "/var/lib/open-cinema/plugins"
    secret_dir: "/var/lib/open-cinema/plugin-secrets"
    generation_retention: 3
    generation_max_bytes: 1073741824
    helper_path: "/usr/local/libexec/open-cinema-plugin-control"
    allow_editable: false
    editable_dirs: []
  managed_static_paths:
    - /etc/open-cinema
    - /etc/nginx/sites-available/open-cinema
    - /etc/nginx/sites-enabled/open-cinema
    - /etc/polkit-1/rules.d/49-open-cinema-processors.rules
    - /etc/systemd/system/open-cinema.service
    - /etc/systemd/system/open-cinema-orchestrator.service
    - /etc/systemd/system/celery.service
    - /etc/systemd/system/celery-beat.service
    - /etc/systemd/system/camilladsp@.service
    - /etc/systemd/system/pcm-auto-decoder@.service
    - /etc/systemd/system/redis-server.service.d/90-open-cinema.conf
    - /etc/systemd/system/nginx.service.d/90-open-cinema.conf
    - /etc/systemd/user/pipewire.service.d/90-open-cinema.conf
    - /etc/systemd/user/wireplumber.service.d/90-open-cinema.conf
    - /etc/tmpfiles.d/open-cinema-camilladsp.conf
    - /etc/tmpfiles.d/open-cinema-decoder.conf
    - /etc/udev/rules.d/49-open-cinema-processors.rules
    - /etc/wireplumber/wireplumber.conf.d
    - /usr/local/libexec/open-cinema-system-control
    - /usr/local/libexec/open-cinema-plugin-control
    - /etc/sudoers.d/open-cinema-system-control

  # Root-level controls stay unavailable unless both this switch and the
  # installed helper/sudo policy self-check succeed.
  system_control:
    enabled: true
    helper_path: /usr/local/libexec/open-cinema-system-control
    sudoers_path: /etc/sudoers.d/open-cinema-system-control

  sqlite:
    busy_timeout_ms: 5000
    wal_autocheckpoint_pages: 1000

  migrations:
    preflight_timeout_seconds: 30
    apply_timeout_seconds: 120
    timeout_kill_grace_seconds: 10

  retention:
    plan_days: 30
    audit_days: 90
    diagnostic_hours: 24
    runtime_projection_hours: 24
    batch_size: 1000

  celery:
    worker_concurrency: 1
    prefetch_multiplier: 1
    max_tasks_per_child: 100
    worker_memory_max_mb: 256
    beat_memory_max_mb: 128
    result_expires_seconds: 3600

  # Django settings
  django:
    secret_key: "CHANGE_ME_IN_PRODUCTION"  # Override in host_vars or vault
    debug: false
    allowed_hosts: "*"
    database: "{{ project_root }}/open-cinema/db.sqlite3"

  # Temporary bootstrap credential for the experimental appliance. Replace the
  # password through Ansible Vault before any supported or exposed deployment.
  default_admin:
    enabled: true
    username: "admin"
    password: "admin"

  # Service ports
  gunicorn_port: 8000
  gunicorn_workers: 2
  gunicorn_version: "23.0.0"

  # The appliance has one accepted full-runtime profile. The contract gate
  # still withholds processor management and live reconciliation while probing
  # a changed candidate.
  orchestration_features:
    orchestration_api: true
    runtime_observation: true
    shadow_resolution: true
    processor_management: true
    live_reconciliation: true
  reconciliation_catchup:
    max_passes: 8
    retry_initial_seconds: 0.1
    retry_max_seconds: 2.0
    retry_multiplier: 2.0

# CamillaDSP Configuration
camilladsp:
  websocket_port: 1234
  websocket_address: "127.0.0.1"
  runtime_dir: "/run/open-cinema/camilladsp"
  instance_count: 1
  bus_prefix: "opencinema.camilladsp"
  conflict_policy: "priority"
  sharing_policy: "exclusive"
  reconfiguration_policy: "reconfigure-idle"

  install_path: "/usr/local/bin/camilladsp"

# PCM Auto Decoder (existing)
pcm_auto_decoder:
  bin_name: "pcm-auto-decoder"
  install_path: "/usr/local/bin/pcm-auto-decoder"
  runtime_dir: "/run/open-cinema/decoder"
  instance_count: 1

# Open Cinema UI (React Applications)
open_cinema_ui:
  # Admin interface (for system configuration)
  admin:
    web_root: "/var/www/open-cinema-admin"
    contract_asset_name: "contracts/audio-orchestration-client-v1.json"

  # User interface (for end users)
  user_ui:
    web_root: "/var/www/open-cinema-ui"

readiness:
  verify_hardware_nodes: false
  expected_hardware_node_patterns: []
