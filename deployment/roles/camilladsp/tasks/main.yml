---
- name: Resolve the audio service UID for independently tagged runs
  ansible.builtin.command:
    argv:
      - id
      - -u
      - "{{ open_cinema.user }}"
  register: open_cinema_camilladsp_uid_command
  changed_when: false

- name: Publish the audio service UID
  ansible.builtin.set_fact:
    open_cinema_uid: "{{ open_cinema_camilladsp_uid_command.stdout | int }}"

- name: Install CamillaDSP native PipeWire runtime dependencies
  ansible.builtin.apt:
    update_cache: true
    name:
      - libpipewire-0.3-0
    state: present

- name: Check if CamillaDSP is already installed
  ansible.builtin.stat:
    path: "{{ camilladsp.install_path }}"
  register: camilladsp_binary

- name: Check installed CamillaDSP version
  ansible.builtin.command: "{{ camilladsp.install_path }} --version"
  register: camilladsp_installed_version
  failed_when: false
  changed_when: false
  when: camilladsp_binary.stat.exists

- name: Determine if CamillaDSP installation is needed
  ansible.builtin.set_fact:
    camilladsp_needs_install: >-
      {{
        not camilladsp_binary.stat.exists or
        (camilladsp_installed_version.stdout is defined and
         open_cinema_release_manifest.components.camilladsp.version | replace('v', '') not in camilladsp_installed_version.stdout)
      }}

- name: Download the pinned CamillaDSP native PipeWire release
  ansible.builtin.get_url:
    url: "{{ open_cinema_release_artifacts.camilladsp.url }}"
    dest: "/tmp/{{ open_cinema_release_artifacts.camilladsp.name }}"
    checksum: "sha256:{{ open_cinema_release_artifacts.camilladsp.sha256 }}"
    mode: '0644'
  when: camilladsp_needs_install | bool

- name: Create a temporary CamillaDSP extraction directory
  ansible.builtin.tempfile:
    state: directory
    prefix: open-cinema-camilladsp-
  register: open_cinema_camilladsp_extract
  when: camilladsp_needs_install | bool

- name: Extract the CamillaDSP native PipeWire release
  ansible.builtin.unarchive:
    src: "/tmp/{{ open_cinema_release_artifacts.camilladsp.name }}"
    dest: "{{ open_cinema_camilladsp_extract.path }}"
    remote_src: true
  when: camilladsp_needs_install | bool

- name: Install CamillaDSP binary
  ansible.builtin.copy:
    src: "{{ open_cinema_camilladsp_extract.path }}/camilladsp"
    dest: "{{ camilladsp.install_path }}"
    remote_src: true
    mode: '0755'
  when: camilladsp_needs_install | bool

- name: Clean up the CamillaDSP extraction directory
  ansible.builtin.file:
    path: "{{ open_cinema_camilladsp_extract.path }}"
    state: absent
  when: camilladsp_needs_install | bool

- name: Install CamillaDSP runtime directory policy
  ansible.builtin.template:
    src: open-cinema-camilladsp.tmpfiles.j2
    dest: /etc/tmpfiles.d/open-cinema-camilladsp.conf
    owner: root
    group: root
    mode: '0644'

- name: Create CamillaDSP runtime directory
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/open-cinema-camilladsp.conf
  changed_when: false

- name: Install managed CamillaDSP instance template
  ansible.builtin.template:
    src: camilladsp@.service.j2
    dest: /etc/systemd/system/camilladsp@.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd units

- name: Stop and disable obsolete singleton CamillaDSP service
  ansible.builtin.systemd:
    name: camilladsp.service
    enabled: false
    state: stopped
  failed_when: false

- name: Remove obsolete singleton CamillaDSP unit
  ansible.builtin.file:
    path: /etc/systemd/system/camilladsp.service
    state: absent
  notify: Reload systemd units

- name: Verify CamillaDSP instance unit
  ansible.builtin.command: systemd-analyze verify /etc/systemd/system/camilladsp@.service
  changed_when: false

# The orchestrator starts only instances with owned runtime configuration.
# No unconfigured template instance is enabled or started by Ansible.
