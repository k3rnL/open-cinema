---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Require an explicit bounded management API network policy
  ansible.builtin.assert:
    that:
      - open_cinema_management_api_networks | length > 0
      - "'0.0.0.0/0' not in open_cinema_management_api_networks"
      - "'::/0' not in open_cinema_management_api_networks"
    fail_msg: >-
      Configure one or more bounded loopback/LAN sources in
      open_cinema_management_api_networks; an all-address API boundary is not
      accepted.

- name: Create the nginx service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Open Cinema nginx lifecycle policy
  ansible.builtin.template:
    src: dependency.service.conf.j2
    dest: /etc/systemd/system/nginx.service.d/90-open-cinema.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Create web root directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop:
    - "{{ open_cinema_ui.admin.web_root }}"
    - "{{ open_cinema_ui.user_ui.web_root }}"

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Install Open Cinema nginx site configuration
  ansible.builtin.template:
    src: open-cinema.conf.j2
    dest: /etc/nginx/sites-available/open-cinema
    mode: '0644'
  notify: Restart nginx

- name: Enable Open Cinema nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/open-cinema
    dest: /etc/nginx/sites-enabled/open-cinema
    state: link
  notify: Restart nginx

- name: Test nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx service
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Apply nginx configuration before UI deployment
  ansible.builtin.meta: flush_handlers
