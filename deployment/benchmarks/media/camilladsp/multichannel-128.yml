---
title: Benchmark multichannel 128
description: Synthetic native PipeWire eight-channel filter workload.
devices:
  samplerate: 48000
  chunksize: 128
  capture:
    type: PipeWire
    channels: 8
    node_name: opencinema.benchmark.camilladsp.capture
    node_description: Open Cinema benchmark CamillaDSP capture
    node_group_name: opencinema.benchmark.camilladsp.group
    autoconnect_to: null
  playback:
    type: PipeWire
    channels: 8
    node_name: opencinema.benchmark.camilladsp.playback
    node_description: Open Cinema benchmark CamillaDSP playback
    node_group_name: opencinema.benchmark.camilladsp.group
    autoconnect_to: null
filters:
  multichannel_gain:
    type: Gain
    parameters:
      gain: -0.5
pipeline:
  - type: Filter
    channels: [0, 1, 2, 3, 4, 5, 6, 7]
    names: [multichannel_gain]
