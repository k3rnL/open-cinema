---
title: Benchmark channel adaptation 128
description: Synthetic 7.1-to-stereo adaptation with explicit downmix gains.
devices:
  samplerate: 48000
  chunksize: 128
  capture:
    type: PipeWire
    channels: 8
    node_name: opencinema.benchmark.camilladsp.capture
    node_description: Open Cinema benchmark CamillaDSP capture
    node_group_name: opencinema.benchmark.camilladsp.group
    autoconnect_to: null
  playback:
    type: PipeWire
    channels: 2
    node_name: opencinema.benchmark.camilladsp.playback
    node_description: Open Cinema benchmark CamillaDSP playback
    node_group_name: opencinema.benchmark.camilladsp.group
    autoconnect_to: null
mixers:
  seven_one_to_stereo:
    channels:
      in: 8
      out: 2
    mapping:
      - dest: 0
        sources:
          - {channel: 0, gain: 0.0}
          - {channel: 2, gain: -3.0}
          - {channel: 3, gain: -9.0}
          - {channel: 4, gain: -6.0}
          - {channel: 6, gain: -6.0}
      - dest: 1
        sources:
          - {channel: 1, gain: 0.0}
          - {channel: 2, gain: -3.0}
          - {channel: 3, gain: -9.0}
          - {channel: 5, gain: -6.0}
          - {channel: 7, gain: -6.0}
pipeline:
  - type: Mixer
    name: seven_one_to_stereo
