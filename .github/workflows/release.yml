name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release commit
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install release tooling
        run: uv pip install --system "PyYAML==6.0.3"

      - name: Build wheel and source distribution
        run: |
          uv build

      - name: Build the pinned pyCamillaDSP control wheel
        env:
          PYCAMILLADSP_COMMIT: fdc0d163e02dd73206a493402b43c83502ad83d7
          PYCAMILLADSP_TAG: v4.0.0
        run: |
          git clone --quiet --branch "$PYCAMILLADSP_TAG" --depth 1 \
            https://github.com/HEnquist/pycamilladsp.git \
            /tmp/pycamilladsp-source
          test "$(git -C /tmp/pycamilladsp-source rev-parse HEAD)" = "$PYCAMILLADSP_COMMIT"
          uv build --wheel \
            --out-dir /tmp/pycamilladsp-dist \
            /tmp/pycamilladsp-source
          test -f /tmp/pycamilladsp-dist/camilladsp-4.0.0-py3-none-any.whl

      - name: Fetch the pinned native CamillaDSP artifact
        env:
          CAMILLADSP_URL: https://github.com/HEnquist/camilladsp/releases/download/v4.1.3/camilladsp-linux-pipewire-aarch64.tar.gz
          CAMILLADSP_SHA256: ca8b6cc32bda29bd7cb38f7bcda5fcc6f5e69690b3d0efaa23b6c3c05c45696c
        run: |
          mkdir -p /tmp/camilladsp-dist
          curl --fail --location --silent --show-error \
            "$CAMILLADSP_URL" \
            --output /tmp/camilladsp-dist/camilladsp-linux-pipewire-aarch64.tar.gz
          printf '%s  %s\n' \
            "$CAMILLADSP_SHA256" \
            /tmp/camilladsp-dist/camilladsp-linux-pipewire-aarch64.tar.gz \
            | sha256sum --check --strict

      - name: Fetch accepted UI and decoder bytes for the coordinated immutable mirror
        env:
          UI_RELEASE_URL: https://github.com/k3rnL/open-cinema-ui/releases/download/v2.0.0
          DECODER_RELEASE_URL: https://github.com/k3rnL/pcm-auto-decoder/releases/download/v0.2.2
        run: |
          mirror=/tmp/coordinated-dependency-dist
          mkdir -p "$mirror"
          for name in \
            open-cinema-admin-v2.0.0.tar.gz \
            open-cinema-admin-v2.0.0.tar.gz.provenance.json \
            open-cinema-ui-v2.0.0.tar.gz \
            open-cinema-ui-v2.0.0.tar.gz.provenance.json; do
            curl --fail --location --silent --show-error \
              "$UI_RELEASE_URL/$name" --output "$mirror/$name"
          done
          for name in \
            pcm-auto-decoder-v0.2.2-debian-trixie-aarch64-unknown-linux-gnu.tar.gz \
            pcm-auto-decoder-v0.2.2-debian-trixie-aarch64-unknown-linux-gnu.tar.gz.provenance.json; do
            curl --fail --location --silent --show-error \
              "$DECODER_RELEASE_URL/$name" --output "$mirror/$name"
          done
          (
            cd "$mirror"
            printf '%s  %s\n' \
              47d215f08a4740e47b7009abb6f0814f94d5330af222c4d98b90caf7ec057ea7 open-cinema-admin-v2.0.0.tar.gz \
              19ce3f8ae3ccd83eab6e1457e26e582b523af83a5a07408082e84ef58f710b1c open-cinema-admin-v2.0.0.tar.gz.provenance.json \
              91980a2c0ac72fe54ae04ba84340fddf89a5edeb3fc40b99cb296748e63d8560 open-cinema-ui-v2.0.0.tar.gz \
              c7f39366661c9ba8c251a43bc79a76981153e095a898510a777ea38161c6a200 open-cinema-ui-v2.0.0.tar.gz.provenance.json \
              7831af706c22198dbb531682264b7eedf88fc693c459d5f4c8c05e154d5e616e pcm-auto-decoder-v0.2.2-debian-trixie-aarch64-unknown-linux-gnu.tar.gz \
              1ebe283c5ce274ed6bbdc1481a5b8fc9a82098f5b133f4dc02ae40a031a84f49 pcm-auto-decoder-v0.2.2-debian-trixie-aarch64-unknown-linux-gnu.tar.gz.provenance.json \
              | sha256sum --check --strict
          )

      - name: Verify tag, metadata, license, and runtime contracts
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          python scripts/verify_release_dist.py \
            --dist-dir dist \
            --expected-version "$release_version" \
            --tag "$GITHUB_REF_NAME"

      - name: Generate provenance and finalize the coordinated manifest
        run: |
          workflow_run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          release_base_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          python scripts/write_release_provenance.py \
            --dist-dir dist \
            --output dist/provenance.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --workflow-run "$workflow_run"
          python scripts/write_release_provenance.py \
            --dist-dir /tmp/pycamilladsp-dist \
            --output dist/pycamilladsp-provenance.json \
            --project pycamilladsp \
            --repository HEnquist/pycamilladsp \
            --commit fdc0d163e02dd73206a493402b43c83502ad83d7 \
            --tag v4.0.0 \
            --workflow-run "$workflow_run"
          python scripts/write_release_provenance.py \
            --dist-dir /tmp/camilladsp-dist \
            --output dist/camilladsp-provenance.json \
            --project camilladsp \
            --repository HEnquist/camilladsp \
            --commit 05e9cfcdf43c0dfe078ed3feb8af4c8bd701fd74 \
            --tag v4.1.3 \
            --workflow-run https://github.com/HEnquist/camilladsp/actions/runs/24210343960
          cp /tmp/pycamilladsp-dist/camilladsp-4.0.0-py3-none-any.whl dist/
          cp /tmp/camilladsp-dist/camilladsp-linux-pipewire-aarch64.tar.gz dist/
          cp /tmp/coordinated-dependency-dist/* dist/
          python scripts/finalize_release_manifest.py \
            --template deployment/release-manifest.yml \
            --output dist/open-cinema-coordinated-manifest.yml \
            --dist-dir dist \
            --provenance dist/provenance.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --workflow-run "$workflow_run" \
            --release-base-url "$release_base_url" \
            --pycamilladsp-wheel dist/camilladsp-4.0.0-py3-none-any.whl \
            --pycamilladsp-provenance dist/pycamilladsp-provenance.json \
            --camilladsp-artifact /tmp/camilladsp-dist/camilladsp-linux-pipewire-aarch64.tar.gz \
            --camilladsp-provenance dist/camilladsp-provenance.json
          python deployment/scripts/validate_release_manifest.py \
            --manifest dist/open-cinema-coordinated-manifest.yml \
            --mode appliance \
            --distribution-family Debian \
            --distribution-major 13 \
            --distribution-codename trixie \
            --architecture aarch64 \
            --python-abi cp313 \
            --wireplumber-api-family 0.5
          cd dist
          sha256sum \
            ./*.whl \
            ./*.tar.gz \
            ./*provenance.json \
            ./open-cinema-coordinated-manifest.yml \
            > checksums.sha256
          cat checksums.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
            dist/*provenance.json
            dist/open-cinema-coordinated-manifest.yml

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten dist folder
        shell: bash
        run: |
          mkdir -p release_dist
          find dist -type f -maxdepth 2 -print -exec cp -v {} release_dist/ \;

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: "release_notes.md"
          GITHUB_REPO: ${{ github.repository }}

      - name: Create draft GitHub release and attach every verified asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: ${{ steps.git-cliff.outputs.content }}
          fail_on_unmatched_files: true
          files: |
            release_dist/*.whl
            release_dist/*.tar.gz
            release_dist/*.sha256
            release_dist/*provenance.json
            release_dist/open-cinema-coordinated-manifest.yml

      - name: Publish the complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Verify the published release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json=""
          for attempt in 1 2 3 4 5; do
            if release_json="$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"; then
              break
            fi
            sleep 1
          done
          test -n "$release_json"
          test "$(jq -r .tag_name <<<"$release_json")" = "$GITHUB_REF_NAME"
          test "$(jq -r .draft <<<"$release_json")" = false
          test "$(jq -r .prerelease <<<"$release_json")" = false
          test "$(jq -r .published_at <<<"$release_json")" != null
          immutable="$(jq -r \
            'if has("immutable") then (.immutable | tostring) else "unknown" end' \
            <<<"$release_json")"
          case "$immutable" in
            true)
              ;;
            false)
              release_id="$(jq -r .id <<<"$release_json")"
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/$release_id"
              echo "Published release was mutable and has been rejected." >&2
              exit 1
              ;;
            *)
              echo "Published release immutability was indeterminate." >&2
              exit 1
              ;;
          esac
